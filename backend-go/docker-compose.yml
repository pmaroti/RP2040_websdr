# Go backend for pico-adc-udp, with the Pico reachable over its USB network.
#
#   docker compose up -d --build     then open http://localhost:8080
#
# Networking: host mode (Linux). The container shares the host's network
# stack, so it sees the Pico's USB network interface (192.168.7.2 on the
# host, Pico at 192.168.7.1) exactly as a program run on the host would,
# including when the Pico is plugged in after the container started. No
# ports need publishing; the web page is on the host's port 8080.
#
# Docker Desktop (macOS / Windows) runs containers in a VM, where host mode
# does not reach the Mac's USB network interface. Use the bridge variant
# there instead:
#
#   docker compose -f docker-compose.bridge.yml up -d --build
#
# See README.md, "Docker", for why that works and what to check.

services:
  websdr:
    build: .
    image: pico-websdr:latest
    network_mode: host
    restart: unless-stopped
    environment:
      # Every option can be set here as PICO_<OPTION>, or added under
      # "command:" as a flag (e.g. command: ["--demo"]).
      PICO_HTTP_PORT: "8080"          # web page
      PICO_DEVICE: "192.168.7.1"      # Pico's address on the USB network
      PICO_UDP_PORT: "7778"           # sample stream arrives here
      PICO_FREQ: "7.1M"               # LO (square wave) at startup: 7.1M, off, keep
      # PICO_HOST: "127.0.0.1"        # serve the page to this machine only
      # PICO_DEMO: "true"             # test signal, no Pico needed
